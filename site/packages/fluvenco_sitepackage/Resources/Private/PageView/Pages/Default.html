<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">
    <f:if condition="{breadcrumb -> f:count()} > 1">
        <nav class="breadcrumb container" aria-label="Breadcrumb">
            <ol>
                <f:for each="{breadcrumb}" as="item" iteration="i">
                    <li>
                        <f:if condition="{i.isLast}">
                            <f:then><span aria-current="page">{item.title}</span></f:then>
                            <f:else><a href="{item.link}">{item.title}</a></f:else>
                        </f:if>
                    </li>
                </f:for>
            </ol>
        </nav>
    </f:if>
    <div class="content">
        <f:cObject typoscriptObjectPath="lib.content" />
    </div>
</f:section>
</html>
